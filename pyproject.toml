[project]
name = "animatic"
version = "0.1.0"
description = "Write a talk as a script; render slides, a handout, a web page and a video from one file."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ryan Kelln" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "pillow>=10",
]
keywords = ["slides", "talks", "presentations", "markdown", "handout"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

[project.scripts]
animatic = "cli:main"

# The builder is a set of flat modules that find themes/ and templates/ beside
# themselves, so install it editable from a checkout (uv sync, or pip install -e .).
[tool.setuptools]
py-modules = [
    "cli", "build", "check", "talkparse", "render", "mediaresolve", "timing",
    "exercises", "webvideo", "falrec", "ingest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
