# corpus.yaml — animatic content-root declaration (T11, check 21).
#
# Machine-local content roots for the corpus harness.  Spec §6 / shipping.md
# ("content roots are config"): a shipped copy of this repo rewrites these
# paths for its own machine — nothing else in the tooling knows where
# content lives.  Committed here because this repo has no remote and the
# TPL residency instance IS Ryan's machine (same precedent as
# remaps/l01-standins.yaml); keep personal paths out of skills/templates.
#
# Sections:
#   decks      — roots scanned for deck dirs (talk.md / *.talk.md).  Each
#                found deck gets the full per-deck check (checks 1-16, 18,
#                28) plus a fresh cues.json artifact build (checks 17/18),
#                then cross-deck slug collisions (check 5).
#   concepts   — additional OKF concept roots (not decks) whose frontmatter
#                `tags:` feed the tag-drift / coverage reports (spec §10).
#                Deck roots also contribute their decks' tags; add the
#                research wiki here.  raw/ and scrapes/ subtrees are
#                machine-collected, never authored concepts, and are skipped.
#   banks      — shared media banks (library.yaml) outside the deck roots.
#                library.yaml files found under deck roots are auto-included;
#                per-deck media/cards.yaml pools are owned by their deck's
#                own check run and are not re-swept here.

decks:
  - ~/talks/decks
  - ~/Documents/art/animatic/examples

concepts:
  - ~/Documents/notes

banks:
  - ~/talks/decks/_media/library.yaml
