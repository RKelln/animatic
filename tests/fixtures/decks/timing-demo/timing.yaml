# timing.yaml — the deck-local timing sidecar (animatic.timing.v1; spec: Timing).
#
# Only deliberate values belong here: an `authored` override for a cue the
# author knows better than the estimate, and `measured` seconds from a
# recording or a test read (the alignment tooling in docs/audio-route.md writes
# those).  The estimate is never echoed back — it is regenerable, and it stays
# in cues.json where it belongs.
schema: animatic.timing.v1
settings:
  wpm: 175            # tunable, user-set; default 150
cues:
  timing-demo-004:
    seconds: 9.0      # the author lingers on the beat
    provenance: authored
  timing-demo-006:
    seconds: 14.5     # test read, stopwatch
    provenance: measured
