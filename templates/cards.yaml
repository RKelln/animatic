- slug: jungle-plantation
  type: composite
  status: prompting
  brief: |
    - SAME line of trees twice: left a dense luminous jungle, right the same trees pruned into a neat plantation
    - the deciding difference is whose hands, not the trees (Bank the Window v9)
    - motion idea: canopy sways and light moves in the jungle half; plantation half stays perfectly still
    - candidate for the AI-video pilot: this is the flagship generation test
  prompts:
    image: "Split diptych, exact mirror composition. Identical rolling tree line across the frame. LEFT HALF: dense luminous jungle, wild growth, deep greens with light shafts, fireflies, alive and unruly. RIGHT HALF: the same trees pruned into straight plantation rows, uniform, orderly, slightly desaturated, nothing moves. The seam between halves is a single soft vertical line. Cinematic, 16:9, painterly realism. The two halves share one horizon so the eye reads 'same place, different hands.'"
    video: "Split diptych filling the frame, hard vertical seam exactly at center. LEFT HALF: dense tropical jungle with broad leaves and palms, thick layered canopy, shafts of sunlight, drifting light, fireflies and stirring undergrowth; all motion in the video lives here, gentle and continuous. RIGHT HALF: a managed plantation of neat identical rows of young conifers on mown grass under a clear bright sky; perfectly still and frozen, as if paused, no motion at all. Locked camera, no zoom, no pan. The seam stays sharp and stable for the whole clip; the halves never bleed, overlap, or morph into each other. Final frame identical to the first so the clip loops seamlessly. 6 seconds. Painterly cinematic realism, 16:9. (a3: fixes from a2 — see gen-log)"
  outputs: []
  credit: Ryan Kelln (generated)
  licence: CC BY-SA
  alt: "Split image: lush jungle on the left, pruned plantation rows on the right, same trees."

