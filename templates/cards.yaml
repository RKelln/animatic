- slug: slop-cascade
  type: video
  status: prompting
  brief: |
    - L01 opening ubiquity beat ("in your feed"): the relentless scroll as the "all at once" feeling
    - proposed placement in talk.md welcome line — needs Ryan's sign-off
    - motion budget pass: still cannot carry this; motion IS the meaning
  prompts:
    image: ""
    video: "Extreme close-up filling the frame: a smartphone screen in a dim room, its bright display the only light. An endless feed scrolls upward, slowly then faster: ad cards, photo thumbnails, video previews, notifications, headlines sliding past, all slightly generic and uncanny; headline text stays an unreadable smear of light, no readable words. The scroll accelerates until the feed blurs into a glowing river of cheap content rushing upward, then cuts back to the first frame seamlessly. No hands, no face, no reflections. 6 seconds, seamless loop. Cinematic macro, screen glow, shallow depth of field."
  outputs: []
  credit: Ryan Kelln (generated)
  licence: CC BY-SA
  alt: ""

