# Media cards — starter set (deck-local; copy to <deck>/media/cards.yaml)
#
# A card is the CURRENT state of one visual: brief, live prompt, approved output.
# The mess of attempts lives in media/gen-log.md (append-only). Visual defaults
# inherit from media/style.md; a card overrides with its own `style:` block.
# Shot refs in talk.md are extensionless slugs that resolve: cards.yaml ->
# deck media/ dir -> shared library. Humans write talk.md; agents draft prompts
# from briefs and iterate in gen-log.md until you approve; the builder
# consumes only current prompts + approved outputs.
#
# Any card may carry `text: light|dark` (light for dark art, dark for bright art):
# the default text= flag for every shot that uses the slug; a shot's own text= wins.
# Likewise `bg: "#rrggbb"`, a colour name (`bg: black`) or `bg: auto` (the media's own top-left colour) sets the
# ground behind contained media, so it meets the frame without a letterbox seam.

- slug: opening-backdrop
  type: image
  status: brief
  brief: |
    - opening backdrop for the talk's title screen
    - say what the picture must carry (mood, subject) and what it must not
  prompts:
    image: "(draft once the art direction is settled)"
    video: ""
  outputs: []
  credit: Your Name (generated)
  licence: CC BY-SA
  alt: ""

- slug: scroll-loop
  type: video
  status: prompting
  brief: |
    - a short seamless loop where the motion IS the meaning (a still cannot carry it)
  prompts:
    image: ""
    video: "Close-up of a phone screen in a dim room; an endless feed scrolls upward, slowly then faster. No readable text, no hands, no faces. 6 seconds, seamless loop."
  outputs: []
  credit: Your Name (generated)
  licence: CC BY-SA
  alt: ""

- slug: traffic-chart
  type: chart
  status: to-find
  brief: |
    - a bar chart of the figure quoted in the talk; find the source first
  prompts:
    image: ""
    video: ""
  outputs: []
  credit: TBD
  licence: TBD
  alt: ""

- slug: my-art
  type: image
  status: have
  pool: ../_media/art              # folder, deck-relative or absolute
  # text: light                    # as on any card: default text= for the pool's shots
  # seed: 2                        # change to re-roll the picks
  # pins:                          # ids that always show one file (left out of the random draw)
  #   title: one-file.png
  alt: Abstract art by Your Name
  credit: Your Name
  licence: CC BY-SA
